name: Production availability

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability
  cancel-in-progress: true

jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public production routes
        env:
          BASE_URL: https://logistics-portal-ten.vercel.app
        run: |
          set -euo pipefail
          for path in / /login /signup /api/health; do
            status="$(curl --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 5 --max-time 25 --output /dev/null --write-out '%{http_code}' "$BASE_URL$path")"
            if [ "$status" != "200" ]; then
              echo "Health check failed: $path returned HTTP $status"
              exit 1
            fi
            echo "OK $path (HTTP $status)"
          done

      - name: Check application version endpoint
        env:
          BASE_URL: https://logistics-portal-ten.vercel.app
        run: |
          set -euo pipefail
          payload="$(curl --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 5 --max-time 25 --fail "$BASE_URL/api/version")"
          node -e "const data = JSON.parse(process.argv[1]); if (!data.version) { throw new Error('Missing application version'); } console.log('OK application version:', data.version);" "$payload"

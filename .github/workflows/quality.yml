name: Quality and browser tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://wudpgqqicypdipxzsrgj.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_jLmofe19_LPWoi14xkkclw_txEqmNBy
      STAGING_SUPABASE_URL: https://wudpgqqicypdipxzsrgj.supabase.co
      STAGING_SUPABASE_ANON_KEY: sb_publishable_jLmofe19_LPWoi14xkkclw_txEqmNBy
      E2E_PLATFORM_ADMIN_EMAIL: staging-platform-admin@example.test
      E2E_PLATFORM_ADMIN_PASSWORD: ${{ secrets.E2E_PLATFORM_ADMIN_PASSWORD }}
      E2E_TENANT_EMAIL: staging-tenant@example.test
      E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify staging migration mirror
        run: npm run check:staging-migrations
      - name: Lint
        run: npm run lint
      - name: Build production application
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run API authorization smoke tests
        run: npm run test:e2e -- e2e/security-api.api.spec.ts
      - name: Run local browser smoke tests
        run: npm run test:e2e -- e2e/smoke.spec.ts
      - name: Run authenticated staging journeys
        if: ${{ env.E2E_PLATFORM_ADMIN_PASSWORD != '' && env.E2E_TENANT_PASSWORD != '' }}
        run: npm run test:e2e -- e2e/authenticated.spec.ts

      - name: Report authenticated test status
        if: ${{ env.E2E_PLATFORM_ADMIN_PASSWORD == '' || env.E2E_TENANT_PASSWORD == '' }}
        run: |
          {
            echo '### Authenticated staging journeys not run'
            echo 'The dedicated staging Platform Admin and tenant passwords are not both configured as GitHub Actions secrets. The non-authenticated quality, API authorization, and browser smoke checks completed separately. Configure both `E2E_PLATFORM_ADMIN_PASSWORD` and `E2E_TENANT_PASSWORD` repository secrets to enable the authenticated tenant-isolation journeys.'
          } >> "$GITHUB_STEP_SUMMARY"
